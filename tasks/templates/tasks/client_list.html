{% extends "base.html" %}
{% block content %}
<div class="company-container">
    <h2 class="company-title">Company List</h2>

    <!-- Right-Aligned Add Button -->
    <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-primary add-company-btn" data-bs-toggle="modal" data-bs-target="#addCompanyModal">
            <i class="fa-solid fa-plus"></i> Add Company
        </button>
    </div>

    <table class="table company-table">
        <thead>
            <tr>
                <th>Company Name</th>
            </tr>
        </thead>
        <tbody>
            {% for client in clients %}
                <tr>
                    <td>{{ client.name }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<!-- Modal for Adding Company -->
<div class="modal fade" id="addCompanyModal" tabindex="-1" aria-labelledby="addCompanyModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addCompanyModalLabel">Add Company</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addCompanyForm" method="post" action="{% url 'client_create' %}">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="addCompanyName" class="form-label">Company Name</label>
                        <input type="text" class="form-control" id="addCompanyName" name="name" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Add Company</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
